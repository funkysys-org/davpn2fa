version: "3.9"

services:

  # ─── OpenVPN Server ──────────────────────────────────────────────────────────
  openvpn:
    build:
      context: .
      dockerfile: Dockerfile
    image: openvpn-2fa:latest
    container_name: openvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${OPENVPN_PORT:-1194}:1194/udp"
    volumes:
      - openvpn-data:/etc/openvpn/data
    environment:
      - OPENVPN_SERVER_IP=${OPENVPN_SERVER_IP:-}
      - OPENVPN_NETWORK=${OPENVPN_NETWORK:-10.8.0.0}
      - OPENVPN_NETMASK=${OPENVPN_NETMASK:-255.255.255.0}
      - OPENVPN_PORT=${OPENVPN_PORT:-1194}
      - OPENVPN_PROTO=${OPENVPN_PROTO:-udp}
      - OPENVPN_DNS1=${OPENVPN_DNS1:-1.1.1.1}
      - OPENVPN_DNS2=${OPENVPN_DNS2:-8.8.8.8}
      - EASYRSA_KEY_SIZE=${EASYRSA_KEY_SIZE:-4096}
      - EASYRSA_CA_EXPIRE=${EASYRSA_CA_EXPIRE:-3650}
      - EASYRSA_CERT_EXPIRE=${EASYRSA_CERT_EXPIRE:-825}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Web Management UI ───────────────────────────────────────────────────────
  webapp:
    build:
      context: webapp
      dockerfile: Dockerfile
    image: openvpn-webapp:latest
    container_name: openvpn-webapp
    restart: unless-stopped
    ports:
      - "${WEBAPP_PORT:-8080}:5000"
    volumes:
      # Shared PKI + user data volume — must match the openvpn service
      - openvpn-data:/etc/openvpn/data
    environment:
      # Supabase (for admin auth + audit log)
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}
      # Flask session signing key — generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-change-me-in-production}
      # Passed through to .ovpn profile builder
      - OPENVPN_SERVER_IP=${OPENVPN_SERVER_IP:-}
      - OPENVPN_PORT=${OPENVPN_PORT:-1194}
      - OPENVPN_PROTO=${OPENVPN_PROTO:-udp}
      - EASYRSA_CERT_EXPIRE=${EASYRSA_CERT_EXPIRE:-825}
      - OPENVPN_DATA_DIR=/etc/openvpn/data
      # Enable Flask debug (set to 1 for development only)
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
    depends_on:
      - openvpn
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openvpn-data:
    driver: local

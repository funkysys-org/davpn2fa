version: "3.9"

services:

  # ─── OpenVPN Server ──────────────────────────────────────────────────────────
  openvpn:
    build:
      context: .
      dockerfile: Dockerfile
    image: openvpn-2fa:latest
    container_name: openvpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv6.conf.all.forwarding: "1"
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "${OPENVPN_PORT:-1194}:1194/udp"
    volumes:
      - openvpn-data:/etc/openvpn/data
    environment:
      - OPENVPN_SERVER_IP=${OPENVPN_SERVER_IP:-}
      - OPENVPN_NETWORK=${OPENVPN_NETWORK:-10.8.0.0}
      - OPENVPN_NETMASK=${OPENVPN_NETMASK:-255.255.255.0}
      - OPENVPN_PORT=${OPENVPN_PORT:-1194}
      - OPENVPN_PROTO=${OPENVPN_PROTO:-udp}
      - OPENVPN_DNS1=${OPENVPN_DNS1:-1.1.1.1}
      - OPENVPN_DNS2=${OPENVPN_DNS2:-8.8.8.8}
      - OPENVPN_STATIC_ROUTES=${OPENVPN_STATIC_ROUTES:-}
      - EASYRSA_KEY_SIZE=${EASYRSA_KEY_SIZE:-4096}
      - EASYRSA_CA_EXPIRE=${EASYRSA_CA_EXPIRE:-3650}
      - EASYRSA_CERT_EXPIRE=${EASYRSA_CERT_EXPIRE:-825}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Web Management UI ───────────────────────────────────────────────────────
  webapp:
    build:
      context: webapp
      dockerfile: Dockerfile
    image: openvpn-webapp:latest
    container_name: openvpn-webapp
    restart: unless-stopped
    ports:
      # Bound to loopback by default: the admin UI must not be directly
      # exposed. Front it with a TLS reverse proxy (nginx/Caddy) with its
      # own access controls, or override deliberately for trusted LANs.
      - "127.0.0.1:${WEBAPP_PORT:-8080}:5000"
    volumes:
      # Shared PKI + user data volume — must match the openvpn service
      - openvpn-data:/etc/openvpn/data
    environment:
      # ─── Admin authentication (local — replaces the former Supabase auth) ──
      # Single admin account. Generate the hash and tokens with:
      #   ADMIN_PASSWORD_HASH: python -c "from werkzeug.security import generate_password_hash as g; print(g('YOUR-PASSWORD'))"
      #   API_TOKEN:            python -c "import secrets; print(secrets.token_hex(32))"
      #   FLASK_SECRET_KEY:     python -c "import secrets; print(secrets.token_hex(32))"
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-}
      - API_TOKEN=${API_TOKEN:-}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY:-}
      # Auth is ON by default. Set AUTH_DISABLED=1 ONLY if the UI is
      # unreachable from untrusted networks.
      - AUTH_DISABLED=${AUTH_DISABLED:-0}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      # Passed through to .ovpn profile builder
      - OPENVPN_SERVER_IP=${OPENVPN_SERVER_IP:-}
      - OPENVPN_PORT=${OPENVPN_PORT:-1194}
      - OPENVPN_PROTO=${OPENVPN_PROTO:-udp}
      - EASYRSA_CERT_EXPIRE=${EASYRSA_CERT_EXPIRE:-825}
      - OPENVPN_DATA_DIR=/etc/openvpn/data
    depends_on:
      - openvpn
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openvpn-data:
    driver: local

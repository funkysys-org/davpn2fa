name: Build & publish images to GHCR

# davpn2fa CI: quality gate (29-check suite) then multi-arch build of
# both images, published to the GitHub Container Registry.
#   openvpn server  -> ghcr.io/funkysys-org/davpn2fa
#   admin webapp    -> ghcr.io/funkysys-org/davpn2fa-webapp
# No secrets to create: GITHUB_TOKEN + packages:write does everything.
# NOTE: the first successful push creates each GHCR package as PRIVATE —
# flip to public in the package settings if the world should pull it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: funkysys-org

jobs:
  test:
    name: Quality gate — 29-check suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            webapp/requirements.txt
            tests/requirements.txt

      - name: Install live-PAM module (suite runs the real pam_google_authenticator)
        run: sudo apt-get update && sudo apt-get install -y libpam-google-authenticator

      - name: Install webapp + test dependencies
        run: pip install -r webapp/requirements.txt -r tests/requirements.txt

      - name: Run the fix-verification suite (root, container-exact /etc layout)
        run: sudo "$(command -v python3)" tests/test_fixes.py

  build:
    name: Build & push (amd64 + arm64)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata — davpn2fa (OpenVPN server)
        id: meta_vpn
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/davpn2fa
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Metadata — davpn2fa-webapp (admin UI)
        id: meta_webapp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/davpn2fa-webapp
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build & push — davpn2fa
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_vpn.outputs.tags }}
          labels: ${{ steps.meta_vpn.outputs.labels }}
          cache-from: type=gha,scope=davpn2fa
          cache-to: type=gha,mode=max,scope=davpn2fa

      - name: Build & push — davpn2fa-webapp
        uses: docker/build-push-action@v6
        with:
          context: ./webapp
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_webapp.outputs.tags }}
          labels: ${{ steps.meta_webapp.outputs.labels }}
          cache-from: type=gha,scope=davpn2fa-webapp
          cache-to: type=gha,mode=max,scope=davpn2fa-webapp
